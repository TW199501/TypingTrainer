name: Auto version

# Every merge into main bumps the patch level, so the four toolchains (npm,
# Cargo, Tauri, MSBuild) never drift apart. Bump minor/major by hand with
# `npm run version:minor` before merging; this job only ever advances the patch.
#
# Tagging and building installers happen only when the commit message contains
# [release]. Doing it on every commit produced a tag and three platforms' worth
# of installers — roughly twenty minutes of CI — for changes as small as a
# five-line workflow edit, and left a trail of tags that pointed at nothing
# anyone had decided to publish.

on:
  push:
    branches: [main]

jobs:
  bump:
    name: bump patch
    runs-on: ubuntu-latest
    # The job's own commit must not retrigger it.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: write
    outputs:
      released: ${{ steps.guard.outputs.release }}
      version: ${{ steps.bump.outputs.version }}
      publish: ${{ steps.commit.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A commit that already carries a tag was released deliberately — bumping
      # it would immediately supersede the version that was just published.
      - name: Check whether this commit is already released
        id: guard
        run: |
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "Already tagged $(git describe --exact-match --tags HEAD); skipping."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump
        id: bump
        if: steps.guard.outputs.release == 'false'
        run: |
          node scripts/version.mjs patch
          echo "version=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Commit, and tag only when publishing
        id: commit
        if: steps.guard.outputs.release == 'false'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PUBLISH: ${{ contains(github.event.head_commit.message, '[release]') }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v$VERSION [skip ci]"

          if [ "$PUBLISH" = "true" ]; then
            # Annotated, not lightweight: --follow-tags only pushes annotated
            # tags, so a lightweight one is silently left behind and the
            # release never happens.
            git tag -a "v$VERSION" -m "TypeLab v$VERSION"
            git push --follow-tags
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            git push
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version is now $VERSION. Add [release] to a commit message to tag and build it."
          fi

  # The tag above was pushed with GITHUB_TOKEN, which GitHub deliberately does
  # not let trigger further workflows. So the release is invoked directly rather
  # than waiting for a `push` event that will never arrive.
  release:
    name: release
    needs: bump
    if: needs.bump.outputs.publish == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.bump.outputs.version }}
