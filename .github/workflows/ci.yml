name: CI

on:
  # PRs target dev; release is fast-forwarded from a tested dev, and main only
  # from release, so main runs nothing of its own.
  push:
    branches: [dev, release, 'hotfix/**']
  pull_request:

jobs:
  web:
    name: web (lint · types · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/dist
          retention-days: 7

  e2e:
    name: e2e (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The config targets the installed Chrome rather than a Playwright
      # download, so the browser has to be present here too.
      - name: Install Chrome
        run: npx playwright install --with-deps chrome

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  server:
    name: server (build · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore server/TypeLab.slnx

      - name: Build
        run: dotnet build server/TypeLab.slnx --no-restore --configuration Release

      - name: Tests
        run: dotnet test server/TypeLab.slnx --no-build --configuration Release --verbosity normal

  # The one check branch protection requires. It fails when any job above
  # failed, was cancelled or was skipped, so adding a job only means adding it
  # to `needs`.
  ci:
    name: ci
    if: always()
    needs: [web, e2e, server]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a job ended with $result"
              exit 1
            fi
          done
