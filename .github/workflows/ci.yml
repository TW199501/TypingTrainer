name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (lint · types · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/dist
          retention-days: 7

  server:
    name: server (build · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore server/TypeLab.slnx

      - name: Build
        run: dotnet build server/TypeLab.slnx --no-restore --configuration Release

      - name: Tests
        run: dotnet test server/TypeLab.slnx --no-build --configuration Release --verbosity normal
