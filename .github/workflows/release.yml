name: Release

# Produces the artefacts a tag implies: desktop installers for the three
# platforms, and container images for the web deployment. Tagging alone only
# records a version — without this, a release has nothing to download.

on:
  # Covers a tag pushed by a person.
  push:
    tags: ['v*']

  # Lets an existing tag be built by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.0.1)'
        required: true
        type: string

  # How version.yml reaches this workflow. A tag pushed with GITHUB_TOKEN does
  # not trigger anything — GitHub suppresses it to avoid recursive runs — so the
  # auto-version job has to call this directly instead of relying on `push`.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  desktop:
    name: desktop (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # The three jobs write the same `latest.json` asset on one release, and
      # tauri-action builds it by reading the existing asset, merging its own
      # platform in, then deleting and re-uploading — with no lock. In parallel
      # the last writer wins and the other platforms' entries vanish from the
      # manifest while every job still reports success.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            # One bundle covering both Apple Silicon and Intel.
            args: '--target universal-apple-darwin'
          - platform: ubuntu-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Speeds up the slowest part of the job by a large margin.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      # Reports the shape of the stored key without revealing it. Three attempts
      # to store this secret all failed identically with "Missing comment in
      # secret key", which says the value reaching the build is not the two-line
      # minisign file — but not why. Length and format distinguish "stored
      # wrong" from "mangled in transit"; neither is visible from the outside.
      - name: Check the shape of the signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "The secret is empty or not readable from this job."
            exit 0
          fi
          echo "characters: ${#KEY}"
          echo "lines: $(printf '%s\n' "$KEY" | wc -l)"
          if printf '%s' "$KEY" | grep -q 'untrusted comment'; then
            echo "format: raw minisign file (has the comment line)"
          elif printf '%s' "$KEY" | tr -d '\n' | grep -qE '^[A-Za-z0-9+/]+=*$'; then
            echo "format: base64"
            decoded=$(printf '%s' "$KEY" | tr -d '\n' | base64 -d 2>/dev/null | head -c 17 || true)
            if [ "$decoded" = "untrusted comment" ]; then
              echo "decodes to: a raw minisign file"
            else
              echo "decodes to: something else"
            fi
          else
            echo "format: neither raw minisign nor clean base64"
          fi

      # Written to a file rather than passed as a string. Tauri base64-decodes
      # TAURI_SIGNING_PRIVATE_KEY but reads _PATH verbatim, so the file route is
      # immune to whichever encoding step has been eating the comment line.
      - name: Restore the signing key to a file
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          path="$RUNNER_TEMP/typelab.key"
          if printf '%s' "$KEY" | grep -q 'untrusted comment'; then
            printf '%s\n' "$KEY" > "$path"
          else
            printf '%s' "$KEY" | tr -d '\n' | base64 -d > "$path"
          fi
          echo "restored $(wc -l < "$path") lines"
          head -c 17 "$path"; echo
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$path" >> "$GITHUB_ENV"

      # Runs `tauri build`, which triggers beforeBuildCommand (npm run build)
      # and uploads the resulting bundles to a draft release.
      #
      # The private key signs every bundle and its `.sig`; `createUpdaterArtifacts`
      # in tauri.conf.json makes the build fail outright when it is missing, so
      # an unsigned release cannot slip out by accident. Set the secrets once
      # with `npm run tauri signer generate` — losing that key means installed
      # apps can never be updated again.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately not TAURI_SIGNING_PRIVATE_KEY: the path is set above.
          # Leaving both set lets the string form win and reintroduces the bug.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'TypeLab ${{ inputs.tag || github.ref_name }}'
          releaseBody: 'Desktop installers. Container images are published to ghcr.io.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # The asset upload inside the updater-JSON merge has no backoff of its
          # own, so a stale asset id surfaces as a 404 on the first try.
          retryAttempts: 3
          # Windows bundles both an .msi (WiX) and a setup.exe (NSIS); this picks
          # which one the `windows-x86_64` entry in latest.json points at. Left
          # explicit because the action's own default is documented as possibly
          # flipping for tauri@v2 apps.
          updaterJsonPreferNsis: false
          # The macOS job builds one universal bundle, which the action expands
          # into darwin-aarch64 and darwin-x86_64 entries. Keeping the universal
          # key as well would leave a third path nothing is tested against.
          updaterJsonKeepUniversal: false

  # The manifest is merged by read-modify-write across the three jobs above, so
  # a lost platform entry leaves every job green while half the installs stop
  # seeing updates. Assert the keys rather than trusting the colours.
  updater-manifest:
    name: verify updater manifest
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # gh needs no checkout: the asset is fetched from the release by tag.
      - name: Every platform is listed in latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release download "$TAG" -p latest.json -D /tmp
          node -e '
            const have = Object.keys(require("/tmp/latest.json").platforms ?? {});
            // The macOS job builds universal, which the action expands to both
            // Apple Silicon and Intel.
            const want = ["windows-x86_64", "darwin-aarch64", "darwin-x86_64", "linux-x86_64"];
            const missing = want.filter((k) => !have.includes(k));
            console.log("latest.json platforms:\n" + have.join("\n"));
            if (missing.length) {
              console.error("missing from latest.json: " + missing.join(", "));
              process.exit(1);
            }
          '

  docker:
    name: container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # GHCR rejects upper-case names, and the repository slug has them.
      - name: Normalise image prefix
        id: img
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.prefix }}/api:${{ inputs.tag || github.ref_name }}
            ${{ steps.img.outputs.prefix }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          # Still the fixtures: the API only serves /health and the generic CRUD
          # routes, so a real-data build would render empty category rows.
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_USE_MOCK=true
          tags: |
            ${{ steps.img.outputs.prefix }}/web:${{ inputs.tag || github.ref_name }}
            ${{ steps.img.outputs.prefix }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
