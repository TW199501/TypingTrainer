name: Sidecar smoke

# Publishes the API as a per-platform single-file sidecar and starts it, the
# way the desktop shell does, on all three desktop platforms.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/build-sidecar.mjs'
      - 'scripts/smoke-sidecar.mjs'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sidecar-smoke.yml'

jobs:
  smoke:
    name: smoke (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: macos-latest
            triple: universal-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build sidecar
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.triple }}
        run: npm run sidecar:build

      - name: Smoke test
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.triple }}
        run: node scripts/smoke-sidecar.mjs

      - name: Check both architectures are present
        if: runner.os == 'macOS'
        run: |
          archs="$(lipo -archs "src-tauri/binaries/typelab-api-${{ matrix.triple }}")"
          echo "archs: $archs"
          case "$archs" in *arm64*) ;; *) echo "::error::arm64 slice missing"; exit 1 ;; esac
          case "$archs" in *x86_64*) ;; *) echo "::error::x86_64 slice missing"; exit 1 ;; esac

      - name: Smoke test under Rosetta (x86_64)
        if: runner.os == 'macOS'
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license
          if ! arch -x86_64 /usr/bin/true; then
            echo "::error::Rosetta is not available, so the x86_64 slice cannot be run"
            exit 1
          fi
          node scripts/smoke-sidecar.mjs "src-tauri/binaries/typelab-api-${{ matrix.triple }}" -- arch -x86_64

  # Builds the real installer, unsigned, and asserts the sidecar is inside it.
  # One format per OS keeps it fast; release.yml builds all of them.
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
          - os: ubuntu-latest
            args: '--bundles deb'
          - os: macos-latest
            args: '--bundles app --target universal-apple-darwin'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      # No signing key here, so updater artifacts are switched off; otherwise
      # createUpdaterArtifacts makes the build fail.
      - name: Build the installer
        shell: bash
        run: npx tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Installer carries the sidecar
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) f=src-tauri/target/release/typelab-api.exe ;;
            Linux)   f=src-tauri/target/release/typelab-api ;;
            macOS)   f=src-tauri/target/universal-apple-darwin/release/bundle/macos/TypeLab.app/Contents/MacOS/typelab-api ;;
          esac
          if [ ! -f "$f" ]; then
            echo "::error::sidecar missing: $f"
            exit 1
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            archs="$(lipo -archs "$f")"
            echo "archs: $archs"
            case "$archs" in *arm64*) ;; *) echo "::error::arm64 slice missing"; exit 1 ;; esac
            case "$archs" in *x86_64*) ;; *) echo "::error::x86_64 slice missing"; exit 1 ;; esac
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            deb="$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)"
            listing="$(dpkg-deb -c "$deb")"
            echo "$listing"
            if ! grep -Eq '(^|[[:space:]])(\./)?usr/bin/typelab-api$' <<<"$listing"; then
              echo "::error::sidecar missing from the .deb"
              exit 1
            fi
          fi
          echo "Sidecar present: $f"
