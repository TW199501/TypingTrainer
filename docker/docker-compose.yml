# Web deployment: Vue bundle behind nginx + the ASP.NET Core API on SQLite.
# Run from the repo root:
#   docker compose -f docker/docker-compose.yml up --build
# Then open http://localhost:8080

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: typelab-api:local
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: DataSource=/data/app.db
    volumes:
      - api-data:/data
    expose:
      - '8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/api/health >/dev/null || exit 1']
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        # Relative base → the browser stays same-origin and nginx proxies /api.
        VITE_API_BASE_URL: /api
        # Still the fixtures: the API only serves /health and the generic CRUD
        # routes so far, so a real-data build would render empty category and
        # topic rows. Flip to 'false' once the endpoints in
        # docs/api-contract.md are implemented.
        VITE_USE_MOCK: '${VITE_USE_MOCK:-true}'
    image: typelab-web:local
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_started

volumes:
  api-data:
